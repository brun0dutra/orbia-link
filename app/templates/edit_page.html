<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Página - Orbia Link</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>📋 Editar Página</h1>
            <a href="/dashboard" class="btn btn-sm btn-outline">← Voltar</a>
        </header>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/dashboard/edit/{{ page.slug }}" method="POST" class="page-form">
            <div class="form-group">
                <label for="name">Nome da Empresa *</label>
                <input type="text" id="name" name="name" value="{{ page.name }}" required placeholder="Ex: Clínica Bella">
            </div>

            <div class="form-group">
                <label for="new_slug">Slug *</label>
                <input type="text" id="new_slug" name="new_slug" value="{{ page.slug }}" required placeholder="Ex: clinica-bella">
                <small>URL pública: /<span id="slug-preview">{{ page.slug }}</span></small>
            </div>

            <div class="form-group">
                <label for="logo">URL da Logo</label>
                <input type="url" id="logo" name="logo" value="{{ page.logo }}" placeholder="https://site.com/logo.png">
                <small>URL externa da imagem da logo</small>
            </div>

            <div class="form-group">
                <label for="theme">Tema *</label>
                <select id="theme" name="theme" required>
                    {% for theme in themes %}
                    <option value="{{ theme }}" {% if theme == page.theme %}selected{% endif %}>{{ theme }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-section">
                <h2>🔘 Botões</h2>
                <p class="help-text">Use os botões ↑ ↓ para reordenar.</p>

                <div id="buttons-container">
                    {% for btn in page.buttons %}
                    <div class="button-entry" data-index="{{ loop.index0 }}">
                        <div class="button-entry-header">
                            <span class="button-number">Botão {{ loop.index }}</span>
                            <div class="button-order-actions">
                                <button type="button" class="btn btn-xs btn-outline" onclick="moveButton(this, -1)" {% if loop.first %}disabled{% endif %}>↑</button>
                                <button type="button" class="btn btn-xs btn-outline" onclick="moveButton(this, 1)" {% if loop.last %}disabled{% endif %}>↓</button>
                                <button type="button" class="btn btn-xs btn-danger" onclick="removeButton(this)">✕</button>
                            </div>
                        </div>
                        <div class="button-fields">
                            <div class="form-group">
                                <label>Título</label>
                                <input type="text" name="btn_title" value="{{ btn.title }}" placeholder="Ex: WhatsApp" required>
                            </div>
                            <div class="form-group">
                                <label>URL</label>
                                <input type="url" name="btn_url" value="{{ btn.url }}" placeholder="Ex: https://wa.me/554899999999" required>
                            </div>
                            <div class="form-group">
                                <label>Tipo</label>
                                <select name="btn_type" required>
                                    {% for bt in button_types %}
                                    <option value="{{ bt }}" {% if bt == btn.type %}selected{% endif %}>{{ bt }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <button type="button" class="btn btn-sm btn-secondary" onclick="addButton()">+ Adicionar Botão</button>
            </div>

            <div class="form-actions">
                <a href="/dashboard" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
        </form>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
