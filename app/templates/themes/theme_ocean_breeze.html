<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ NAME }} - Orbia Link</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Theme: Ocean Breeze */
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 30%, #7dd3fc 60%, #38bdf8 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-primary: #0c4a6e;
            --text-secondary: #0369a1;

            --btn-bg: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            --btn-hover: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            --btn-text: #ffffff;

            --btn-border-radius: 30px;
            --shadow: 0 8px 32px rgba(14, 165, 233, 0.2);

            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
            color: var(--text-primary);
        }

        .page-container {
            max-width: 480px;
            width: 100%;
            padding: 48px 28px;
            text-align: center;

            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08), var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .page-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;

            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.25);
        }

        .page-name {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 28px 0;
            letter-spacing: -0.02em;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 16px 24px;

            background: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;

            border-radius: var(--btn-border-radius);
            font-size: 1rem;
            font-weight: 600;

            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.2);

            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .link-button:hover::before {
            left: 100%;
        }

        .link-button:hover {
            background: var(--btn-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(14, 165, 233, 0.35);
        }

        .link-button:active {
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 36px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="page-container">
        {{ LOGO }}
        <h1 class="page-name">{{ NAME }}</h1>

        <div class="links-container">
            {{ BUTTONS }}
        </div>

        <div class="footer">Powered by Orbia Link</div>
    </div>
</body>
</html>
