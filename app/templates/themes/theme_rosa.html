<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ NAME }} - Orbia Link</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Theme: Dark Pink Neon */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f12 0%, #18141f 50%, #231726 100%);
            --card-bg: rgba(25, 25, 30, 0.9);
            --text-primary: #ffffff;
            --text-secondary: #d38ab4;

            --btn-bg: linear-gradient(135deg, #ff4fa3 0%, #d63384 100%);
            --btn-hover: linear-gradient(135deg, #ff66b2 0%, #e64998 100%);
            --btn-text: #ffffff;

            --btn-border-radius: 18px;
            --shadow: 0 8px 30px rgba(255, 79, 163, 0.18);

            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
            color: var(--text-primary);
        }

        .page-container {
            max-width: 480px;
            width: 100%;
            padding: 40px 24px;
            text-align: center;

            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);

            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
        }

        .page-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;

            border: 3px solid #ff4fa3;
            box-shadow: 0 0 25px rgba(255, 79, 163, 0.35);
        }

        .page-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 24px 0;
            letter-spacing: 0.5px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 16px 24px;

            background: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;

            border-radius: var(--btn-border-radius);
            font-size: 1rem;
            font-weight: 600;

            transition: all 0.25s ease;
            box-shadow: var(--shadow);
        }

        .link-button:hover {
            background: var(--btn-hover);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 35px rgba(255, 79, 163, 0.25);
        }

        .link-button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.75;
        }
    </style>
</head>
<body>
    <div class="page-container">
        {{ LOGO }}
        <h1 class="page-name">{{ NAME }}</h1>

        <div class="links-container">
            {{ BUTTONS }}
        </div>

        <div class="footer">Powered by Orbia Link</div>
    </div>
</body>
</html>
